services:
  relayd:
    build: .
    image: relayd:latest
    container_name: relayd
    ports:
      - "127.0.0.1:18099:18099"
    volumes:
      # 凭据配置与数据目录在仓库根（relayd-ark.yaml 与 data/ 均已 gitignore）；
      # 运行容器一直以仓库根路径挂载，compose 与之对齐。
      - ../relayd-ark.yaml:/app/relayd.yaml:ro
      - ../data:/data
    restart: unless-stopped
