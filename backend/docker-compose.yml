services:
  upstream:
    build:
      context: .
      target: upstream
    image: modelsurge-upstream:latest
    volumes:
      - ./upstream.yaml:/app/upstream.yaml:ro
      - ../data/upstream:/data
      - ../data/legacy:/legacy:ro
    expose:
      - "18100"
    healthcheck:
      test: ["CMD", "wget", "--header=Authorization: Bearer local-service-key", "-qO-", "http://127.0.0.1:18100/internal/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  relay:
    build:
      context: .
      target: relay
    image: modelsurge-relay:latest
    depends_on:
      upstream:
        condition: service_healthy
    ports:
      - "127.0.0.1:18099:18099"
    volumes:
      - ./relay.yaml:/app/relay.yaml:ro
      - ../data/relay:/data
    restart: unless-stopped
