# relayd 配置模板（脱敏示例）
#
# relayd 是协议转换网关：客户端可以用 Anthropic / OpenAI Chat /
# OpenAI Responses / Gemini 任一协议接入，上游可以是其中任一协议。
#
# 客户端入口（单一 listen 地址，按路径前缀区分协议）：
#   POST /anthropic/v1/messages                                 -> anthropic
#   POST /anthropic/v1/messages/count_tokens                    -> anthropic 计数（无 anthropic 上游时本地粗估）
#   POST /openai/v1/chat/completions                            -> openai-chat
#   POST /openai/v1/responses                                   -> openai-responses
#   POST /gemini/v1beta/models/{model}:generateContent          -> gemini（非流式）
#   POST /gemini/v1beta/models/{model}:streamGenerateContent    -> gemini（流式）
# 无前缀的原生路径（/v1/messages 等）同样可用。
#
# 账号全部保存在 SQLite（scheduler.db_path），yaml 不再配置上游。
# 启动后经管理面热建号（X-Admin-Key 鉴权），例如：
#   curl -X POST http://127.0.0.1:8080/admin/accounts \
#     -H "X-Admin-Key: sk-admin-change-me" -H "Content-Type: application/json" \
#     -d '{"name":"claude-main","type":"api-key","protocol":"anthropic",
#          "base_url":"https://api.anthropic.com","api_key":"sk-ant-xxx",
#          "models":{"claude-sonnet-4":"claude-sonnet-4-20250514"}}'
# kiro 型账号传 "type":"kiro" 与凭据。三种认证方法（source）三选一，
# 每种均支持路径或内联（creds_text 文本 XOR creds_b64 base64，三者互斥）：
#   refresh_token: 裸 refreshToken 串 或 {"refreshToken":...} JSON
#   creds_file:    credentials.json 原文
#   cli_db:        提取的凭据 JSON，或 base64(SQLite 库文件)
# 内联仅存 SQLite（文本区粘贴即可接入，无需往服务器放文件）；token 轮转
# 由 token_state 列持久化，内联字段不回写。示例：
#   {"name":"k1","type":"kiro","kiro":{"source":"refresh_token","creds_text":"rt-xxx"}}
#   {"name":"k2","type":"kiro","kiro":{"source":"cli_db","creds_b64":"<base64 of .aws/sso/kiro db>"}}
#
# api-key 账号的 base_url 支持自适应探测（GET 模型列表，零 token 消耗）：
#   裸域名 "api.anthropic.com"（自动补 https）；
#   SDK 风格 "https://host/v1" 或完整端点 "https://host/v1/chat/completions"
#     （自动剥版本段/端点尾段，不双拼）；
#   网关路径 "/api/v1"（自动试出正确根地址）。
# 建号/更新时探测并把解析出的根地址写回 base_url（响应带 probe 报告：
# 逐候选证据 + 上游模型列表）；POST /admin/accounts/{name}/test 可重探测修正。

listen: "127.0.0.1:8080"
api_key: "sk-replace-me" # 客户端鉴权 key（Bearer 或 x-api-key 均可）

# 等上游首个 SSE 事件的超时：超时且未向客户端写字节时换下一个候选账号重发。
# 空 = 30s，"0" 禁用。
first_token_timeout: "30s"

# 上游未上报 usage 时本地粗估兜底（估算值不代表真实计费口径，默认关）。
estimate_usage: false

# 访问日志（method/path/status/耗时），默认开；设为 false 关闭。
access_log: true

# 截断恢复（上游截断工具参数/正文后，下次请求注入合成提示），默认开。
truncation_recovery: true

# 账号池动态调度（SQLite 持久化：冷却/禁用/熔断/逐笔 usage），必填。
scheduler:
  db_path: ./data/relayd.db      # SQLite 文件路径
  same_account_retries: 1        # 瞬时错误（5xx/网络/超时）原地重试次数
  cooldowns:                     # 限流（429）冷却时长
    default: 5h                  # 窗口识别失败兜底
    window_7h: 7h                # 7 小时窗口
    monthly: 24h                 # 月度窗口（真实重置时间未知）

# 管理面（必填）：同一 listen 端口的 /admin 前缀，
# X-Admin-Key 鉴权，账号热增删改查（api-key / kiro 型）。
admin:
  api_key: "sk-admin-change-me"

# kiro 协议账号的全局段（可选；不配置则全默认）。
# region 为账号级可覆盖的默认；fake_reasoning / web_search_inject
# 为账号级可另开的下限；其余为进程级运行参数。
kiro:
  region: us-east-1               # SSO 刷新区默认；空 = us-east-1
  first_token_timeout: 15s        # kiro 候选首事件超时；空 = 沿用全局
  streaming_read_timeout: 300s     # 流式 chunk 间读超时看门狗；空/0 = 禁用
  recovery_timeout: 60s           # 熔断指数退避基数
  max_backoff_multiplier: 1440    # 熔断冷却封顶（60s × 1440 = 24h）
  probabilistic_retry: 0.1        # 熔断半开试探概率（0-1）
  cache_ttl: 12h                  # kiro 模型缓存 TTL
  fake_reasoning: false           # 合成 thinking 标签注入（伪装思考模式）
  fake_reasoning_max_tokens: 4000 # 合成思考默认预算
  web_search_inject: false        # web_search 工具注入（MCP 代执行）
  # cloud:                        # 云中转（KiroaaS Cloud forward Lambda）
  #   enabled: true
  #   forward_url: https://cloud.kiroaas.hnew.city/forward
  #   api_key: ""
  debug: false                    # Kiro 出站载荷调试日志（脱敏落盘）
  debug_dir: kiro-debug           # 调试日志目录
