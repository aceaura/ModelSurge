# relayd 配置模板（脱敏示例）
#
# relayd 是协议转换网关：客户端可以用 Anthropic / OpenAI Chat /
# OpenAI Responses / Gemini 任一协议接入，上游可以是其中任一协议。
#
# 客户端入口（单一 listen 地址，按路径前缀区分协议）：
#   POST /anthropic/v1/messages                                 -> anthropic
#   POST /anthropic/v1/messages/count_tokens                    -> anthropic 计数（无 anthropic 上游时本地粗估）
#   POST /openai/v1/chat/completions                            -> openai-chat
#   POST /openai/v1/responses                                   -> openai-responses
#   POST /gemini/v1beta/models/{model}:generateContent          -> gemini（非流式）
#   POST /gemini/v1beta/models/{model}:streamGenerateContent    -> gemini（流式）
# 无前缀的原生路径（/v1/messages 等）同样可用。

listen: "127.0.0.1:8080"
api_key: "sk-replace-me" # 客户端鉴权 key（Bearer 或 x-api-key 均可）

# 等上游首个 SSE 事件的超时：超时且未向客户端写字节时换下一个候选上游重发。
# 空 = 30s，"0" 禁用。
first_token_timeout: "30s"

# 上游未上报 usage 时本地粗估兜底（估算值不代表真实计费口径，默认关）。
estimate_usage: false

upstreams:
  # Anthropic 订阅 / API
  - name: claude-main
    protocol: anthropic
    base_url: https://api.anthropic.com
    api_key: sk-ant-xxx
    models: # canonical model -> 上游 native model
      claude-sonnet-4: claude-sonnet-4-20250514

  # OpenAI 兼容站（new-api / one-api 等）
  - name: openai-station
    protocol: openai-chat
    base_url: https://your-station.example.com
    api_key: sk-xxx
    models:
      gpt-4o: gpt-4o

  # OpenAI Responses 上游（如 Codex 兼容端点）
  - name: codex
    protocol: openai-responses
    base_url: https://api.openai.com
    api_key: sk-xxx
    models:
      gpt-5: gpt-5

  # Gemini AI Studio
  - name: gemini
    protocol: gemini
    base_url: https://generativelanguage.googleapis.com
    api_key: AIza-xxx
    models:
      gemini-2.5-pro: gemini-2.5-pro

  # models 省略 = 透传型上游：接受任意模型名原样转发（作为兜底）
  # - name: catch-all
  #   protocol: openai-chat
  #   base_url: https://openrouter.ai
  #   api_key: sk-or-xxx
