# relayd 本地演示配置（配合 cmd/relaymock 使用）
listen: "127.0.0.1:8080"
api_key: "sk-local-change-me"

upstreams:
  # OpenAI 协议 mock
  - name: st-a
    protocol: openai-chat
    base_url: http://127.0.0.1:9001
    api_key: sk-mock-a
    models:
      gpt-4o: gpt-4o

  # Anthropic 协议 mock
  - name: cl-01
    protocol: anthropic
    base_url: http://127.0.0.1:9003
    api_key: sk-mock-c
    models:
      claude-sonnet-4: claude-sonnet-4
